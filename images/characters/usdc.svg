<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="usdc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a1a"/>
      <stop offset="100%" style="stop-color:#050d0d"/>
    </linearGradient>
    <linearGradient id="usdc-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#E8E8E8"/>
      <stop offset="100%" style="stop-color:#CCCCCC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#usdc-bg)" rx="20"/>

  <!-- Clean white glow -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>

  <!-- Pristine body - white and silver -->
  <path d="M120,400 L135,200 Q135,130 200,130 Q265,130 265,200 L280,400 Z" fill="url(#usdc-body)" filter="url(#shadow)"/>

  <!-- Clean suit lines -->
  <line x1="200" y1="130" x2="200" y2="400" stroke="#AAAAAA" stroke-width="1" opacity="0.5"/>

  <!-- Head -->
  <circle cx="200" cy="105" r="38" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Transparent code effect (visible through form) -->
  <g opacity="0.3">
    <rect x="150" y="150" width="100" height="150" fill="none" stroke="#2775CA" stroke-width="2"/>
    <text x="160" y="170" font-family="monospace" font-size="8" fill="#2775CA">if(transparent)</text>
    <text x="160" y="185" font-family="monospace" font-size="8" fill="#2775CA">{  audit++; }</text>
    <text x="160" y="200" font-family="monospace" font-size="8" fill="#2775CA">if(compliant)</text>
    <text x="160" y="215" font-family="monospace" font-size="8" fill="#2775CA">{  trust++; }</text>
  </g>

  <!-- Honest blue eyes -->
  <ellipse cx="180" cy="95" rx="12" ry="10" fill="#2775CA" filter="url(#glow)"/>
  <ellipse cx="220" cy="95" rx="12" ry="10" fill="#2775CA" filter="url(#glow)"/>
  <circle cx="180" cy="95" r="4" fill="#FFF"/>
  <circle cx="220" cy="95" r="4" fill="#FFF"/>

  <!-- Sincere smile -->
  <path d="M185,120 Q200,130 215,120" fill="none" stroke="#2775CA" stroke-width="2" stroke-linecap="round"/>

  <!-- Shield of compliance -->
  <g transform="translate(200, 250)">
    <path d="M0,-30 L30,0 L20,35 L0,45 L-20,35 L-30,0 Z" fill="#2775CA" stroke="#FFF" stroke-width="2" filter="url(#shadow)"/>
    <path d="M0,-20 L20,0 L13,23 L0,30 L-13,23 L-20,0 Z" fill="#FFFFFF"/>
    <text x="0" y="5" font-family="Arial" font-size="12" fill="#2775CA" text-anchor="middle" font-weight="bold">✓</text>
  </g>

  <!-- Compliance papers -->
  <g transform="translate(310, 300)">
    <rect x="-20" y="-30" width="40" height="60" fill="#E8E8E8" stroke="#2775CA" stroke-width="2"/>
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#2775CA" stroke-width="2"/>
    <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#2775CA" stroke-width="2"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#2775CA" stroke-width="2"/>
    <text x="0" y="20" font-family="Arial" font-size="10" fill="#2775CA" text-anchor="middle">AUDIT</text>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">USDC</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="12" fill="#2775CA" text-anchor="middle">USD COIN • THE GUARDIAN</text>
</svg>