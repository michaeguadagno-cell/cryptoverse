<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="pepe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="100%" style="stop-color:#050d05"/>
    </linearGradient>
    <linearGradient id="pepe-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF00"/>
      <stop offset="50%" style="stop-color:#32CD32"/>
      <stop offset="100%" style="stop-color:#228B22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Chaotic background -->
  <rect width="400" height="400" fill="url(#pepe-bg)" rx="20"/>

  <!-- Random chaos elements -->
  <g opacity="0.2">
    <text x="50" y="80" font-family="Arial" font-size="40" fill="#00FF00" transform="rotate(-20, 50, 80)">K</text>
    <text x="320" y="60" font-family="Arial" font-size="30" fill="#FFD700" transform="rotate(15, 320, 60)">E</text>
    <text x="350" y="350" font-family="Arial" font-size="35" fill="#FF00FF" transform="rotate(-10, 350, 350)">M</text>
    <text x="30" y="340" font-family="Arial" font-size="28" fill="#00FFFF" transform="rotate(20, 30, 340)">E</text>
  </g>

  <!-- Frog body -->
  <ellipse cx="200" cy="230" rx="90" ry="80" fill="url(#pepe-body)" filter="url(#shadow)"/>

  <!-- Big frog eyes (derpy) -->
  <ellipse cx="150" cy="180" rx="35" ry="40" fill="#FFF"/>
  <ellipse cx="250" cy="180" rx="35" ry="40" fill="#FFF"/>
  <ellipse cx="155" cy="190" rx="20" ry="25" fill="#000"/>
  <ellipse cx="255" cy="190" rx="20" ry="25" fill="#000"/>
  <circle cx="160" cy="185" r="8" fill="#FFF"/>
  <circle cx="260" cy="185" r="8" fill="#FFF"/>

  <!-- Derpy smile -->
  <path d="M140,240 Q200,300 260,240" fill="#228B22" stroke="#000" stroke-width="3"/>
  <path d="M150,250 Q200,280 250,250" fill="#FFF"/>

  <!-- Tongue (out, chaotic) -->
  <path d="M200,270 Q180,320 220,340 Q260,320 200,270" fill="#FF6B8A" stroke="#8B0000" stroke-width="2"/>

  <!-- Frog feet -->
  <ellipse cx="120" cy="300" rx="35" ry="20" fill="#228B22"/>
  <ellipse cx="280" cy="300" rx="35" ry="20" fill="#228B22"/>

  <!-- Crown of chaos -->
  <g transform="translate(200, 90)">
    <path d="M-40,30 L-45,0 L-25,15 L0,-20 L25,15 L45,0 L40,30 Z" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <text x="-25" y="10" font-family="Arial" font-size="12" fill="#000">?</text>
    <text x="0" y="-5" font-family="Arial" font-size="14" fill="#000">?</text>
    <text x="25" y="10" font-family="Arial" font-size="12" fill="#000">?</text>
  </g>

  <!-- Chaos sparkles -->
  <g filter="url(#glow)">
    <polygon points="70,120 75,135 90,135 78,145 83,160 70,150 57,160 62,145 50,135 65,135" fill="#FFD700" opacity="0.7"/>
    <polygon points="330,140 335,152 347,152 337,160 341,172 330,164 319,172 323,160 313,152 325,152" fill="#FF00FF" opacity="0.6"/>
    <circle cx="50" cy="200" r="5" fill="#00FFFF" opacity="0.5"/>
    <circle cx="350" cy="220" r="4" fill="#FFD700" opacity="0.6"/>
  </g>

  <!-- Fourth wall break sign -->
  <g transform="translate(320, 80)">
    <rect x="-30" y="-20" width="60" height="40" fill="#1a1a1a" stroke="#FFD700" stroke-width="2" rx="5"/>
    <text x="0" y="5" font-family="Arial" font-size="10" fill="#FFD700" text-anchor="middle">4th</text>
    <text x="0" y="18" font-family="Arial" font-size="10" fill="#FFD700" text-anchor="middle">wall</text>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial Black, sans-serif" font-size="24" fill="#00FF00" text-anchor="middle">PEPE</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="12" fill="#228B22" text-anchor="middle">THE CHAOS FROG</text>
</svg>