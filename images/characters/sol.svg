<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sol-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d051a"/>
    </linearGradient>
    <linearGradient id="sol-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945FF"/>
      <stop offset="50%" style="stop-color:#7B2FFF"/>
      <stop offset="100%" style="stop-color:#5B1FDF"/>
    </linearGradient>
    <linearGradient id="sol-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14F195"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sol-bg)" rx="20"/>

  <!-- Speed blur rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#14F195" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="#14F195" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#14F195" stroke-width="1" opacity="0.1"/>

  <!-- SOL symbol body -->
  <circle cx="200" cy="200" r="85" fill="url(#sol-body)" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="85" fill="none" stroke="#9945FF" stroke-width="3"/>

  <!-- Inner gradient circle -->
  <circle cx="200" cy="200" r="65" fill="none" stroke="#14F195" stroke-width="2" opacity="0.8"/>

  <!-- SOL logo mark -->
  <circle cx="200" cy="200" r="45" fill="#14F195" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="30" fill="#9945FF"/>
  <circle cx="200" cy="200" r="15" fill="#14F195"/>

  <!-- Speed lines -->
  <g opacity="0.7">
    <path d="M80,200 L50,200" stroke="#14F195" stroke-width="3" stroke-linecap="round"/>
    <path d="M85,170 L60,155" stroke="#14F195" stroke-width="2" stroke-linecap="round"/>
    <path d="M85,230 L60,245" stroke="#14F195" stroke-width="2" stroke-linecap="round"/>
    <path d="M320,200 L350,200" stroke="#14F195" stroke-width="3" stroke-linecap="round"/>
    <path d="M315,170 L340,155" stroke="#14F195" stroke-width="2" stroke-linecap="round"/>
    <path d="M315,230 L340,245" stroke="#14F195" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flashy eyes -->
  <ellipse cx="170" cy="195" rx="15" ry="12" fill="#14F195" filter="url(#glow)"/>
  <ellipse cx="230" cy="195" rx="15" ry="12" fill="#14F195" filter="url(#glow)"/>
  <circle cx="170" cy="195" r="6" fill="#FFF"/>
  <circle cx="230" cy="195" r="6" fill="#FFF"/>

  <!-- Confident smirk -->
  <path d="M180,230 Q200,245 220,230" fill="none" stroke="#14F195" stroke-width="3" stroke-linecap="round"/>

  <!-- Party sparkles -->
  <g filter="url(#glow)">
    <polygon points="85,120 88,128 96,128 90,133 92,141 85,136 78,141 80,133 74,128 82,128" fill="#14F195" opacity="0.8"/>
    <polygon points="315,120 318,128 326,128 320,133 322,141 315,136 308,141 310,133 304,128 312,128" fill="#14F195" opacity="0.8"/>
    <circle cx="100" cy="100" r="4" fill="#9945FF"/>
    <circle cx="300" cy="100" r="4" fill="#9945FF"/>
    <circle cx="320" cy="150" r="3" fill="#14F195"/>
    <circle cx="80" cy="150" r="3" fill="#14F195"/>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#9945FF" text-anchor="middle">SOLANA</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="14" fill="#14F195" text-anchor="middle">SOL • THE ROCKET</text>
</svg>