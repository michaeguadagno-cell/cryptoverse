<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="ledger-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1000"/>
      <stop offset="100%" style="stop-color:#0d0800"/>
    </linearGradient>
    <linearGradient id="ledger-book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017"/>
      <stop offset="50%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="runes">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#ledger-bg)" rx="20"/>

  <!-- Ancient glow -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#D4A017" stroke-width="1" opacity="0.1"/>

  <!-- Floating book body -->
  <g transform="translate(200,200)" filter="url(#shadow)">
    <!-- Book cover -->
    <rect x="-80" y="-100" width="160" height="200" rx="5" fill="url(#ledger-book)" stroke="#FFD700" stroke-width="3"/>
    <!-- Spine -->
    <rect x="-85" y="-100" width="15" height="200" rx="3" fill="#8B6914" stroke="#FFD700" stroke-width="2"/>
    <!-- Inner pages -->
    <rect x="-70" y="-90" width="135" height="180" fill="#FFF8DC" opacity="0.9"/>
    <!-- Glowing runes on pages -->
    <g filter="url(#glow)">
      <text x="-55" y="-60" font-family="serif" font-size="14" fill="#D4A017" opacity="0.8">const block = {</text>
      <text x="-55" y="-42" font-family="serif" font-size="14" fill="#D4A017" opacity="0.8">  hash: "...",</text>
      <text x="-55" y="-24" font-family="serif" font-size="14" fill="#D4A017" opacity="0.8">  prev: "...",</text>
      <text x="-55" y="-6" font-family="serif" font-size="14" fill="#D4A017" opacity="0.8">  tx: [...]</text>
      <text x="-55" y="12" font-family="serif" font-size="14" fill="#D4A017" opacity="0.8">};</text>
      <text x="-55" y="35" font-family="serif" font-size="12" fill="#8B6914" opacity="0.6">// Genesis: 2009</text>
      <text x="-55" y="52" font-family="serif" font-size="12" fill="#8B6914" opacity="0.6">// Every tx recorded</text>
    </g>
    <!-- Eyes in the ink -->
    <ellipse cx="-30" cy="70" rx="12" ry="8" fill="#1a1000"/>
    <ellipse cx="-10" cy="70" rx="12" ry="8" fill="#1a1000"/>
    <circle cx="-30" cy="70" r="4" fill="#FFD700" filter="url(#glow)"/>
    <circle cx="-10" cy="70" r="4" fill="#FFD700" filter="url(#glow)"/>
  </g>

  <!-- Floating golden chains (transactions) -->
  <g filter="url(#glow)" opacity="0.5">
    <ellipse cx="100" cy="150" rx="20" ry="8" fill="none" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="100" cy="170" rx="20" ry="8" fill="none" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="100" cy="190" rx="20" ry="8" fill="none" stroke="#FFD700" stroke-width="2"/>
    <line x1="120" y1="150" x2="130" y2="170" stroke="#FFD700" stroke-width="2"/>
    <line x1="120" y1="170" x2="130" y2="190" stroke="#FFD700" stroke-width="2"/>
  </g>

  <!-- Mystical glow around book -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3" filter="url(#glow)"/>

  <!-- Floating runes outside -->
  <g filter="url(#runes)" opacity="0.4">
    <text x="60" y="100" font-family="serif" font-size="20" fill="#D4A017">⬡</text>
    <text x="320" y="120" font-family="serif" font-size="16" fill="#D4A017">⬢</text>
    <text x="330" y="280" font-family="serif" font-size="18" fill="#D4A017">◈</text>
    <text x="50" cy="300" font-family="serif" font-size="14" fill="#D4A017">◇</text>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#D4A017" text-anchor="middle">THE LEDGER</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="12" fill="#8B6914" text-anchor="middle">THE ANCIENT RECORD</text>
</svg>