<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="pd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#200a0a"/>
      <stop offset="100%" style="stop-color:#100505"/>
    </linearGradient>
    <linearGradient id="pd-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="50%" style="stop-color:#FF0000"/>
      <stop offset="100%" style="stop-color:#CC0000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#pd-bg)" rx="20"/>

  <!-- Angry aura -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#FF0000" stroke-width="2" opacity="0.2"/>

  <!-- PUMP/DUMP arrows -->
  <g filter="url(#glow)">
    <path d="M80,100 L120,60 L110,70 L130,50" stroke="#00FF00" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="60" y="130" font-family="Arial Black" font-size="18" fill="#00FF00">PUMP</text>
  </g>
  <g filter="url(#glow)">
    <path d="M320,100 L280,60 L290,70 L270,50" stroke="#FF0000" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="290" y="130" font-family="Arial Black" font-size="18" fill="#FF0000">DUMP</text>
  </g>

  <!-- Volatile body (changes size) -->
  <g transform="translate(200, 220)">
    <circle cx="0" cy="0" r="70" fill="url(#pd-body)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FF6666" stroke-width="3" stroke-dasharray="10,5"/>
  </g>

  <!-- Inflated rage face -->
  <circle cx="200" cy="200" r="60" fill="url(#pd-body)" filter="url(#shadow)"/>

  <!-- Angry eyes (bulging) -->
  <circle cx="170" cy="190" r="20" fill="#FFF"/>
  <circle cx="230" cy="190" r="20" fill="#FFF"/>
  <circle cx="170" cy="190" r="12" fill="#FF0000" filter="url(#glow)"/>
  <circle cx="230" cy="190" r="12" fill="#FF0000" filter="url(#glow)"/>
  <circle cx="170" cy="190" r="5" fill="#000"/>
  <circle cx="230" cy="190" r="5" fill="#000"/>

  <!-- Angry eyebrows -->
  <path d="M145,165 L190,175" stroke="#8B0000" stroke-width="5" stroke-linecap="round"/>
  <path d="M255,165 L210,175" stroke="#8B0000" stroke-width="5" stroke-linecap="round"/>

  <!-- Rage mouth -->
  <path d="M160,230 Q200,260 240,230" fill="#FFF" stroke="#8B0000" stroke-width="3"/>
  <path d="M170,235 L175,245 M185,238 L190,248 M200,240 L200,250 M215,238 L210,248 M225,235 L230,245" stroke="#FF0000" stroke-width="2"/>

  <!-- Sweat drops -->
  <ellipse cx="120" cy="180" rx="8" ry="12" fill="#00D4FF" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="280" cy="180" rx="8" ry="12" fill="#00D4FF" opacity="0.7" filter="url(#glow)"/>

  <!-- Price chart on body (spiky) -->
  <g transform="translate(200, 220)" opacity="0.5">
    <path d="M-40,20 L-30,-10 L-20,15 L-10,-25 L0,10 L10,-20 L20,5 L30,-15 L40,20" fill="none" stroke="#FFF" stroke-width="2"/>
  </g>

  <!-- Trembling hands -->
  <g transform="translate(100, 280)">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#CC0000" filter="url(#shadow)"/>
    <path d="M-15,-10 L-20,-25 M-5,-12 L-5,-28 M5,-12 L5,-28 M15,-10 L20,-25" stroke="#FF6666" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(300, 280)">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#CC0000" filter="url(#shadow)"/>
    <path d="M-15,-10 L-20,-25 M-5,-12 L-5,-28 M5,-12 L5,-28 M15,-10 L20,-25" stroke="#FF6666" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial Black, sans-serif" font-size="24" fill="#FF4444" text-anchor="middle">PUMP DUMPER</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="12" fill="#FF0000" text-anchor="middle">THE MANIPULATOR</text>
</svg>