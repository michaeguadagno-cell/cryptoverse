<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="ada-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000820"/>
      <stop offset="100%" style="stop-color:#000410"/>
    </linearGradient>
    <linearGradient id="ada-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0033AD"/>
      <stop offset="50%" style="stop-color:#002588"/>
      <stop offset="100%" style="stop-color:#001560"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#ada-bg)" rx="20"/>

  <!-- Philosopher's circle glow -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#0033AD" stroke-width="1" opacity="0.2"/>

  <!-- Main body -->
  <circle cx="200" cy="200" r="90" fill="url(#ada-body)" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#0033AD" stroke-width="3"/>

  <!-- ADA infinite symbol -->
  <g transform="translate(200,200)" fill="#FFF">
    <circle cx="0" cy="-15" r="25" fill="none" stroke="#FFF" stroke-width="6"/>
    <circle cx="0" cy="15" r="25" fill="none" stroke="#FFF" stroke-width="6"/>
    <rect x="-8" y="-20" width="16" height="40" fill="#0033AD"/>
  </g>

  <!-- Thoughtful eyes -->
  <ellipse cx="170" cy="190" rx="15" ry="10" fill="#FFF"/>
  <ellipse cx="230" cy="190" rx="15" ry="10" fill="#FFF"/>
  <circle cx="170" cy="190" r="6" fill="#0033AD"/>
  <circle cx="230" cy="190" r="6" fill="#0033AD"/>

  <!-- Wise, measured smile -->
  <path d="M185,225 Q200,235 215,225" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Book of knowledge -->
  <g transform="translate(290, 280)">
    <rect x="-25" y="-35" width="50" height="70" rx="3" fill="#002588" stroke="#0033AD" stroke-width="2"/>
    <line x1="-20" y1="-25" x2="20" y2="-25" stroke="#FFF" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="-15" x2="15" y2="-15" stroke="#FFF" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#FFF" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="5" x2="10" y2="5" stroke="#FFF" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#FFF" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="25" x2="5" y2="25" stroke="#FFF" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Glasses -->
  <ellipse cx="170" cy="190" rx="22" ry="15" fill="none" stroke="#FFF" stroke-width="2"/>
  <ellipse cx="230" cy="190" rx="22" ry="15" fill="none" stroke="#FFF" stroke-width="2"/>
  <line x1="192" y1="190" x2="208" y2="190" stroke="#FFF" stroke-width="2"/>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0033AD" text-anchor="middle">CARDANO</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="14" fill="#FFF" opacity="0.6" text-anchor="middle">ADA • THE PHILOSOPHER</text>
</svg>