<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="eth-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d2e"/>
    </linearGradient>
    <linearGradient id="eth-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B9FE8"/>
      <stop offset="50%" style="stop-color:#627EEA"/>
      <stop offset="100%" style="stop-color:#3D5AB8"/>
    </linearGradient>
    <linearGradient id="eth-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#627EEA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#eth-bg)" rx="20"/>

  <!-- Glow ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#627EEA" stroke-width="2" opacity="0.2" filter="url(#glow)"/>

  <!-- Wizard robe body -->
  <path d="M120,400 L130,280 Q150,200 200,180 Q250,200 270,280 L280,400 Z" fill="url(#eth-body)" filter="url(#shadow)"/>

  <!-- Robe details -->
  <path d="M150,320 Q200,340 250,320" fill="none" stroke="#3D5AB8" stroke-width="2"/>
  <path d="M140,360 Q200,380 260,360" fill="none" stroke="#3D5AB8" stroke-width="2"/>

  <!-- Glowing code streams -->
  <g opacity="0.8">
    <path d="M130,200 Q160,180 180,200" fill="none" stroke="url(#eth-glow)" stroke-width="2" filter="url(#glow)"/>
    <path d="M220,200 Q240,180 270,200" fill="none" stroke="url(#eth-glow)" stroke-width="2" filter="url(#glow)"/>
    <path d="M140,220 L150,240 L160,220" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <path d="M240,220 L250,240 L260,220" fill="none" stroke="#00D4FF" stroke-width="2"/>
  </g>

  <!-- Wizard head -->
  <circle cx="200" cy="150" r="55" fill="#8B9FE8" filter="url(#shadow)"/>

  <!-- Hood -->
  <path d="M130,130 Q200,80 270,130 Q270,100 200,70 Q130,100 130,130" fill="#3D5AB8"/>

  <!-- Eyes (glowing cyan) -->
  <ellipse cx="180" cy="145" rx="12" ry="10" fill="#00D4FF" filter="url(#glow)"/>
  <ellipse cx="220" cy="145" rx="12" ry="10" fill="#00D4FF" filter="url(#glow)"/>
  <circle cx="180" cy="145" r="5" fill="#FFF"/>
  <circle cx="220" cy="145" r="5" fill="#FFF"/>

  <!-- Confident smile -->
  <path d="M180,170 Q200,185 220,170" fill="none" stroke="#1a1a3e" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating tablet -->
  <g transform="translate(290, 250)" filter="url(#glow)">
    <rect x="-30" y="-40" width="60" height="80" rx="5" fill="#1a1a2e" stroke="#00D4FF" stroke-width="2"/>
    <rect x="-25" y="-35" width="50" height="70" rx="3" fill="#0d0d1a"/>
    <text x="0" y="-10" font-family="monospace" font-size="10" fill="#00D4FF" text-anchor="middle">if(smart){</text>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#00D4FF" text-anchor="middle">  build();</text>
    <text x="0" y="20" font-family="monospace" font-size="10" fill="#00D4FF" text-anchor="middle">}</text>
  </g>

  <!-- Magic wand -->
  <g transform="translate(100, 270) rotate(-30)">
    <rect x="-5" y="-60" width="10" height="70" rx="3" fill="#3D5AB8"/>
    <circle cx="0" cy="-65" r="10" fill="#00D4FF" filter="url(#glow)"/>
    <circle cx="0" cy="-65" r="5" fill="#FFF"/>
    <!-- Sparkles -->
    <circle cx="-20" cy="-50" r="2" fill="#00D4FF" opacity="0.8"/>
    <circle cx="20" cy="-70" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="25" cy="-40" r="1.5" fill="#00D4FF" opacity="0.7"/>
  </g>

  <!-- Ethereum diamond on chest -->
  <g transform="translate(200, 300)" filter="url(#glow)">
    <polygon points="0,-25 25,0 0,25 -25,0" fill="#627EEA" stroke="#00D4FF" stroke-width="2"/>
    <polygon points="0,-15 15,0 0,15 -15,0" fill="#8B9FE8"/>
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#00D4FF" opacity="0.5"/>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#627EEA" text-anchor="middle">ETHEREUM</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="14" fill="#888" text-anchor="middle">ETH</text>
</svg>