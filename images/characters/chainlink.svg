<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="link-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1525"/>
      <stop offset="100%" style="stop-color:#050d15"/>
    </linearGradient>
    <linearGradient id="link-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E3CE6"/>
      <stop offset="50%" style="stop-color:#1E2CA8"/>
      <stop offset="100%" style="stop-color:#151D6B"/>
    </linearGradient>
    <linearGradient id="chain-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#F0B90B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#link-bg)" rx="20"/>

  <!-- Chain link rings -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#2E3CE6" stroke-width="2" opacity="0.15"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#2E3CE6" stroke-width="2" opacity="0.1"/>

  <!-- Hooded figure -->
  <path d="M100,400 L130,180 Q130,100 200,80 Q270,100 270,180 L300,400 Z" fill="url(#link-body)" filter="url(#shadow)"/>

  <!-- Hood -->
  <path d="M110,180 Q110,60 200,40 Q290,60 290,180 Q260,110 200,100 Q140,110 110,180" fill="#151D6B"/>

  <!-- Glowing oracle eyes -->
  <ellipse cx="170" cy="150" rx="15" ry="10" fill="#FFD700" filter="url(#glow)"/>
  <ellipse cx="230" cy="150" rx="15" ry="10" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="170" cy="150" r="6" fill="#FFF"/>
  <circle cx="230" cy="150" r="6" fill="#FFF"/>

  <!-- Oracle mouth (prophetic) -->
  <path d="M185,180 Q200,190 215,180" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>

  <!-- Chain link symbol on chest -->
  <g transform="translate(200, 260)">
    <circle cx="0" cy="0" r="35" fill="#151D6B" stroke="url(#chain-gold)" stroke-width="4"/>
    <path d="M-15,-15 L-15,15 L15,15 L15,-15" fill="none" stroke="#FFD700" stroke-width="4"/>
    <circle cx="-15" cy="-15" r="8" fill="#151D6B" stroke="#FFD700" stroke-width="3"/>
    <circle cx="15" cy="-15" r="8" fill="#151D6B" stroke="#FFD700" stroke-width="3"/>
    <circle cx="-15" cy="15" r="8" fill="#151D6B" stroke="#FFD700" stroke-width="3"/>
    <circle cx="15" cy="15" r="8" fill="#151D6B" stroke="#FFD700" stroke-width="3"/>
  </g>

  <!-- Data streams -->
  <g filter="url(#glow)" opacity="0.5">
    <path d="M100,150 Q60,200 100,250" fill="none" stroke="#2E3CE6" stroke-width="2"/>
    <path d="M300,150 Q340,200 300,250" fill="none" stroke="#2E3CE6" stroke-width="2"/>
    <circle cx="100" cy="200" r="4" fill="#FFD700"/>
    <circle cx="300" cy="200" r="4" fill="#FFD700"/>
  </g>

  <!-- Floating data orbs -->
  <g filter="url(#glow)">
    <circle cx="80" cy="100" r="6" fill="#2E3CE6" opacity="0.6"/>
    <circle cx="320" cy="120" r="5" fill="#2E3CE6" opacity="0.5"/>
    <circle cx="60" cy="300" r="4" fill="#2E3CE6" opacity="0.4"/>
    <circle cx="340" cy="280" r="5" fill="#2E3CE6" opacity="0.5"/>
  </g>

  <!-- Cryptic warning text -->
  <g opacity="0.4">
    <text x="200" y="330" font-family="monospace" font-size="10" fill="#FFD700" text-anchor="middle">WARNING: path divergence detected</text>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2E3CE6" text-anchor="middle">CHAINLINK</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="12" fill="#FFD700" text-anchor="middle">THE ORACLE</text>
</svg>