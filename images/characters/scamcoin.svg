<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="scam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#0d0505"/>
    </linearGradient>
    <linearGradient id="scam-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#444"/>
      <stop offset="50%" style="stop-color:#666"/>
      <stop offset="100%" style="stop-color:#333"/>
    </linearGradient>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#scam-bg)" rx="20"/>

  <!-- Spooky glow -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#FF0000" stroke-width="1" opacity="0.2" filter="url(#glow-red)"/>

  <!-- Scamcoin body (flickering coin) -->
  <circle cx="200" cy="200" r="100" fill="url(#scam-body)" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#888" stroke-width="2"/>

  <!-- Inner coin detail -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Dollar sign (fake money) -->
  <text x="200" y="185" font-family="Arial Black, sans-serif" font-size="70" font-weight="bold" fill="#00FF00" text-anchor="middle" filter="url(#glow-red)">$</text>

  <!-- Hollow eyes -->
  <ellipse cx="170" cy="200" rx="20" ry="25" fill="#000"/>
  <ellipse cx="230" cy="200" rx="20" ry="25" fill="#000"/>
  <circle cx="170" cy="200" r="8" fill="#FF0000" filter="url(#glow-red)"/>
  <circle cx="230" cy="200" r="8" fill="#FF0000" filter="url(#glow-red)"/>
  <circle cx="170" cy="200" r="3" fill="#FFF"/>
  <circle cx="230" cy="200" r="3" fill="#FFF"/>

  <!-- Evil smile -->
  <path d="M160,250 Q200,290 240,250" fill="none" stroke="#FF0000" stroke-width="4" stroke-linecap="round"/>

  <!-- Outstretched hand -->
  <g transform="translate(300, 200)">
    <path d="M0,0 L40,-10 L35,0 L45,-5 L40,5 L50,0" fill="#666" stroke="#888" stroke-width="1"/>
    <circle cx="50" cy="0" r="8" fill="#00FF00" opacity="0.8" filter="url(#glow-red)"/>
  </g>

  <!-- Suit (shifting into crypto logos) -->
  <path d="M130,300 L200,280 L270,300 L280,400 L120,400 Z" fill="#222" stroke="#444" stroke-width="2"/>
  <text x="200" y="350" font-family="Arial" font-size="12" fill="#00FF00" text-anchor="middle" opacity="0.5">PROMISES</text>
  <text x="200" y="370" font-family="Arial" font-size="12" fill="#FF0000" text-anchor="middle" opacity="0.5">GUARANTEED</text>

  <!-- Crown of lies -->
  <g transform="translate(200, 85)">
    <path d="M-35,25 L-40,0 L-25,10 L0,-10 L25,10 L40,0 L35,25 Z" fill="#333" stroke="#FF0000" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial" font-size="14" fill="#FF0000" text-anchor="middle">💀</text>
  </g>

  <!-- Character name -->
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF0000" text-anchor="middle">SCAMCOIN</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">SCAM</text>
</svg>